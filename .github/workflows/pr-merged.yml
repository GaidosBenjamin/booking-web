name: PR Merged

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::218014314930:role/github-actions-lightsail-deploy
          aws-region: eu-central-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/assets s3://${{ secrets.FRONTEND_BUCKET_NAME }}/assets --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ s3://${{ secrets.FRONTEND_BUCKET_NAME }} --delete --exclude "assets/*" --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.FRONTEND_DISTRIBUTION_ID }} --paths "/*"
