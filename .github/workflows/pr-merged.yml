name: PR Merged

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Build & Deploy (${{ matrix.env }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        env: [dev, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ matrix.env == 'dev' && secrets.DEV_VITE_API_BASE_URL || secrets.PROD_VITE_API_BASE_URL }}
          VITE_ORG_SLUG: ${{ matrix.env == 'dev' && secrets.DEV_VITE_ORG_SLUG || secrets.PROD_VITE_ORG_SLUG }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::218014314930:role/github-actions-lightsail-deploy
          aws-region: eu-central-1

      - name: Deploy to S3
        env:
          BUCKET: ${{ matrix.env == 'dev' && secrets.DEV_FRONTEND_BUCKET_NAME || secrets.PROD_FRONTEND_BUCKET_NAME }}
        run: |
          aws s3 sync dist/assets s3://$BUCKET/assets --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ s3://$BUCKET --delete --exclude "assets/*" --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ matrix.env == 'dev' && secrets.DEV_FRONTEND_DISTRIBUTION_ID || secrets.PROD_FRONTEND_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
