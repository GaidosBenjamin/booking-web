name: PR Open

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build (${{ matrix.env }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: [dev, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ matrix.env == 'dev' && secrets.DEV_VITE_API_BASE_URL || secrets.PROD_VITE_API_BASE_URL }}
          VITE_ORG_SLUG: ${{ matrix.env == 'dev' && secrets.DEV_VITE_ORG_SLUG || secrets.PROD_VITE_ORG_SLUG }}
        run: npm run build
